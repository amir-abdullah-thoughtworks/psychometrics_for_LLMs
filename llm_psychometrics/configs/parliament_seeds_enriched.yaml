    - name: TaxationAndSpending
      description: The Taxation and Spending debate in the UK focuses on how the government
        raises revenue through taxes and allocates funds for public services and infrastructure.
        Parties differ significantly on how tax systems should be structured and where
        budget allocations should prioritize, affecting individuals, businesses, and
        economic growth. The debate extends into areas like fairness of taxation,
        the importance of supporting key sectors, environmental considerations, and
        economic redistribution.
      stances:
      - bullet: The level of taxation should be reduced to encourage economic growth.
        id: taxation_reduction_growth
        description: Reducing taxes will spur economic growth by allowing individuals
          and businesses to retain more of their income and profits, fueling investment
          and spending.
        party_distribution:
