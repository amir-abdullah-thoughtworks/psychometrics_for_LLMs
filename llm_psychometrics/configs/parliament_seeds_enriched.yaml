        impact, cultural diversity, border security, and human rights. Opinions differ
        on how to manage immigration levels, support refugees and asylum seekers,
        address workforce demands, and ensure national security. Political parties
        vary significantly in their emphasis on restrictive or welcoming approaches,
        reflecting diverse philosophies and their respective voter bases’ concerns.
      stances:
