          SinnFein: 0.6
          SDLP: 0.7
          Alliance: 0.7
          Independent: 0.5
        rationale: Labour, SNP, and the Liberal Democrats see immigration as beneficial
          for addressing skills shortages, aligning with their emphasis on progressive
          economic policies.
      - bullet: Economic impact of immigration
        id: immigration_negative_impact
        description: Critics claim that immigration puts pressure on public services
          and suppresses local wages.
        party_distribution:
          Conservative: 0.75
