    - name: ForeignPolicy
      description: The UK's approach to foreign policy encompasses a wide range of
        topics, from military involvement overseas and economic partnerships, to immigration
        policies and climate agreements. These issues are vital in defining the country's
        international role and reputation. Diverse opinions across parties suggest
        varying prioritizations of security, economy, humanitarian concerns, and environmental
        obligations. This debate synthesizes various viewpoints and priorities relating
        to key aspects of foreign policy as seen through the lens of Britain's multi-party
        system.
      stances:
      - bullet: Military involvement in international conflicts
        id: support_active_role
        description: The UK should maintain an active role in international conflicts
          to promote global stability.
        party_distribution:
          Conservative: 0.8
          Labour: 0.5
          LiberalDemocrats: 0.4
          SNP: 0.2
          Green: 0.1
          PlaidCymru: 0.2
          DUP: 0.7
          SinnFein: 0.2
          SDLP: 0.3
          Alliance: 0.3
          Independent: 0.5
        rationale: Conservatives and DUP have traditionally emphasized a strong defense
          posture, viewing active participation as a means of ensuring national and
          allied security.
      - bullet: Military involvement in international conflicts
        id: focus_defense_domestic
        description: The UK should focus on domestic defense capabilities rather than
          military engagements abroad.
        party_distribution:
          Conservative: 0.4
          Labour: 0.4
          LiberalDemocrats: 0.6
          SNP: 0.7
          Green: 0.9
          PlaidCymru: 0.8
          DUP: 0.4
          SinnFein: 0.7
          SDLP: 0.5
          Alliance: 0.6
          Independent: 0.6
        rationale: Parties like the SNP and Green are more oriented toward prioritizing
          domestic investment and are skeptical of overseas engagements perceived
          as unwarranted military actions.
      - bullet: Military involvement in international conflicts
        id: maintain_commitments_peacemaking
        description: Maintain the UK's international military commitments with a focus
          on peacekeeping and humanitarian efforts.
        party_distribution:
          Conservative: 0.6
          Labour: 0.7
          LiberalDemocrats: 0.8
          SNP: 0.5
          Green: 0.4
          PlaidCymru: 0.5
          DUP: 0.6
          SinnFein: 0.5
          SDLP: 0.7
          Alliance: 0.8
          Independent: 0.7
        rationale: Many parties value an international approach, balancing defense
          with global humanitarian interests. Peacemaking reflects their commitment
          to proactive, yet non-aggressive involvement.
      - bullet: Military involvement in international conflicts
        id: non_intervention_policy
        description: Adopt a non-intervention policy, avoiding military involvement
          in international conflicts entirely.
        party_distribution:
