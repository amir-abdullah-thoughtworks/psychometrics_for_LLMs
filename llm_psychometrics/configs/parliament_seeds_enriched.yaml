          reflected in their strong stance. The DUP also supports strict controls
          due to concerns over security and social impacts.
      - bullet: Border control measures
        id: border_relaxed_control
        description: Support for more relaxed border controls hinges on the importance
          of openness and human rights.
        party_distribution:
          Conservative: 0.1
          Labour: 0.55
          LiberalDemocrats: 0.6
          SNP: 0.7
          Green: 0.8
          PlaidCymru: 0.7
