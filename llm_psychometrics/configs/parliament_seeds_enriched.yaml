          Labour: 0.2
          LiberalDemocrats: 0.5
          SNP: 0.3
          Green: 0.2
          PlaidCymru: 0.3
          DUP: 0.8
          SinnFein: 0.2
          SDLP: 0.3
          Alliance: 0.5
          Independent: 0.4
        rationale: The Conservative Party generally favors lower taxes to boost growth,
          a stance shared with the DUP. Liberal Democrats and Alliance show some support
          as centrists. Progressive parties like Labour, Greens, and Sinn Féin prefer
          redistribution to growth.
