          SDLP: 0.6
          Alliance: 0.5
          Independent: 0.5
        rationale: Many parties support the importance of religious freedom due to
          historical and cultural influences, though more secular parties like Green
          and some elements within Labour may push back in favour of equal regulatory
          application.
      - bullet: Freedom of religious expression should be prioritized over secular
          regulations.
        id: regulation_with_limits
