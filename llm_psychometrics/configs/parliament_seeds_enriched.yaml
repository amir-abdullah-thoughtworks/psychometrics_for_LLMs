    - name: NHSAndSocialCare
      description: The UK government is debating policies to address the challenges
        faced by the NHS and social care system. This debate highlights differences
        in approaches towards funding, administration, integration with social care,
        staff support, and tackling inefficiencies within the system. Various stances
        are adopted based on party priorities and values, touching upon essential
        aspects such as technological adoption, resource allocation, privatization
        impacts, and preventative care strategies. These stances represent broad directions
        parties wish to steer these pivotal public services towards sustainable future
        operation.
      stances:
      - bullet: Funding mechanisms for the NHS.
        id: funding_publicly_financed
        description: The NHS should be primarily funded through general taxation,
          ensuring equal access for all.
        party_distribution:
          Conservative: 0.4
          Labour: 0.9
          LiberalDemocrats: 0.7
          SNP: 0.8
          Green: 0.9
          PlaidCymru: 0.6
          DUP: 0.5
          SinnFein: 0.7
          SDLP: 0.6
          Alliance: 0.7
          Independent: 0.6
        rationale: Labour, Green, and SNP have historically been proponents of equitable
          healthcare funding. Conservatives might favor this for practicality but
          prefer private sector roles. Other parties usually support inclusivity with
          adjustments.
      - bullet: Funding mechanisms for the NHS.
        id: funding_incentivize_efficiency
