          SinnFein: 0.1
          SDLP: 0.5
          Alliance: 0.6
          Independent: 0.5
        rationale: Mainstream UK parties generally favour strong international alliances
          like NATO; this stance aligns with conventional security policies. Regional
          parties may prefer more local autonomy from global military blocs.
