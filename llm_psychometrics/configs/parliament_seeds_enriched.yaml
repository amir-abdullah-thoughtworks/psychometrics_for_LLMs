    - name: ElectoralReform
      description: The debate on electoral reform in the UK addresses multiple critical
        areas including the need for fair representation, maintaining constituency
        links, and adjusting voting methods to better reflect the political will of
        the populace. Traditionalists argue for the stability and familiarity of the
        existing first-past-the-post (FPTP) system, whereas reformers champion more
        proportional systems that they believe will offer fairer results. Various
        sub-issues such as lowering the voting age, implementing term limits, compulsory
        voting, and creating electoral commissions are hotly contested, as each proposed
        change influences how different parties and candidates would be impacted.
      stances:
      - bullet: Adopt proportional representation over first-past-the-post.
        id: pr_adoption
        description: Proportional representation will ensure that every vote counts
          and prevent smaller parties from being disenfranchised.
        party_distribution:
          Conservative: 0.3
          Labour: 0.6
          LiberalDemocrats: 0.9
          SNP: 0.9
          Green: 0.95
          PlaidCymru: 0.8
          DUP: 0.2
          SinnFein: 0.7
          SDLP: 0.75
          Alliance: 0.9
          Independent: 0.4
        rationale: Liberal Democrats, Greens, SNP, and Plaid Cymru consistently favour
          proportional systems for their more representative potential, as they stand
          to gain additional seats. Larger traditional parties are mixed; Labour may
          support reform to curb Conservative majorities, while Conservatives tend
          to oppose changes favouring stability of the current system.
      - bullet: Adopt proportional representation over first-past-the-post.
        id: fptp_retention
        description: The first-past-the-post system ensures stable governments with
          clear mandates, crucial for maintaining governance.
        party_distribution:
          Conservative: 0.85
          Labour: 0.3
          LiberalDemocrats: 0.1
          SNP: 0.2
          Green: 0.05
          PlaidCymru: 0.1
          DUP: 0.75
          SinnFein: 0.2
          SDLP: 0.3
          Alliance: 0.2
          Independent: 0.6
        rationale: Conservatives and the DUP prioritize system stability, which they
          believe is better served by FPTP. Labour is split due to regional interests.
          Parties seeing reduced chances under FPTP such as Liberal Democrats advocate
          against it.
      - bullet: Lower the voting age to 16.
        id: vote_16_lower
        description: Lowering the voting age would engage younger citizens in democratic
          processes earlier, enhancing political participation long term.
        party_distribution:
