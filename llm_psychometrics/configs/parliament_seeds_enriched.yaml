    - name: WelfareAndBenefits
      description: The Welfare and Benefits debate is centred on how the UK government
        should manage social security programmes to support the financially vulnerable
        while ensuring economic stability. Central to the discussion are considerations
        about eligibility criteria, the impact of welfare on the labor market, and
        the implications for public expenditure. The debate involves evaluating the
        current state of benefits distribution, balancing progressive and conservative
        fiscal approaches, and considering regional differences in socio-economic
        needs across the UK.
      stances:
      - bullet: Universal Basic Income implementation
        id: ubi_implementation
        description: A universal basic income (UBI) should be introduced to provide
          financial security to all citizens regardless of employment status.
        party_distribution:
          Conservative: 0.2
          Labour: 0.6
          LiberalDemocrats: 0.5
          SNP: 0.8
          Green: 0.9
          PlaidCymru: 0.7
          DUP: 0.1
          SinnFein: 0.6
          SDLP: 0.5
          Alliance: 0.4
          Independent: 0.3
        rationale: Parties like SNP, Green, and PlaidCymru strongly support UBI due
          to its potential to reduce inequality. Labour sees it as part of broader
          welfare reforms. Conservative and DUP members are less supportive, viewing
          it as economically burdensome.
      - bullet: Universal Basic Income implementation
        id: no_ubi_current_conditions
        description: There is no need for a UBI under the current economic conditions
          due to high costs and uncertain benefits.
        party_distribution:
          Conservative: 0.8
          Labour: 0.3
          LiberalDemocrats: 0.4
          SNP: 0.2
          Green: 0.1
          PlaidCymru: 0.3
          DUP: 0.7
          SinnFein: 0.4
          SDLP: 0.4
          Alliance: 0.6
          Independent: 0.5
        rationale: Conservative and DUP view financial pragmatism as key, whereas
          Green and SNP place greater emphasis on the welfare net’s scope over potential
          budgetary strains.
      - bullet: Universal Basic Income implementation
        id: pilot_ubi_to_assess_impact
        description: A pilot program should be implemented to evaluate the practical
          implications and effects of UBI.
        party_distribution:
          Conservative: 0.3
          Labour: 0.7
          LiberalDemocrats: 0.8
          SNP: 0.9
          Green: 0.9
          PlaidCymru: 0.7
          DUP: 0.4
          SinnFein: 0.6
          SDLP: 0.5
          Alliance: 0.7
          Independent: 0.6
        rationale: With broad-based empirical curiosity, Labour and LiberalDemocrats
          see pilots as data-driven decision aids, also championed by devolved governance-favored
          parties.
      - bullet: Universal Basic Income implementation
        id: reduce_existing_welfare_expand_ubi
        description: Reduction in certain existing benefits is necessary to sustainably
          fund UBI systems.
        party_distribution:
