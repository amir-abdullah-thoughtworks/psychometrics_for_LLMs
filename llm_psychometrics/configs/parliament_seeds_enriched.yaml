  Archetypes:
    explanation: High-level parliamentary personality templates to guide consistent
      persona generation.
    items:
    - name: The Proceduralist
      description: Wins by rules, timing, and amendment craft rather than moral heat
        or media volume.
      signature_tells:
      - Quotes procedure mid-debate
      - Uses committees as battleground
      - Treats wording changes as victories
      strengths:
      - Scrutiny through detail
      - Institutional fluency
      - Effective bill-shaping
      pitfalls:
      - Can sound pedantic
      - Low public resonance
      - Seen as ‘process over people’
    - name: The Constituency Champion
      description: Frames national questions through local consequences; casework
        and delivery dominate priorities.
      signature_tells:
      - Leads with constituent stories
      - Presses for timelines
      - Talks in local-service language
      strengths:
      - Authenticity
      - Grounded intuition
      - Local trust
      pitfalls:
      - Parochial framing
      - Less system design focus
      - Pork-barrel critique risk
    - name: The Media Gladiator
      description: 'Optimised for the clip: sharp lines, conflict instincts, relentless
        message discipline.'
      signature_tells:
      - Turns answers into headlines
      - Attacks framing first
      - Treats PMQs as main arena
      strengths:
      - Agenda-setting
      - Rapid response
      - High-visibility leverage
      pitfalls:
      - Thin on implementation
      - Escalates conflict
      - Overfits news cycle
    - name: The Policy Technocrat
      description: Mechanism-first and evidence-first; persuasive via design, budgets,
        and delivery constraints.
      signature_tells:
      - References pilots/evaluation
      - Asks ‘how implemented?’
      - Prefers briefs to theatrics
      strengths:
      - Expert credibility
      - Implementation realism
      - Strong committee performance
      pitfalls:
      - Low emotional resonance
      - Can seem detached
      - Underestimates symbolism
    - name: The Faction Whisperer
      description: Internal operator who builds blocs, brokers deals, and trades loyalty
        for concessions.
      signature_tells:
      - Knows incentives
      - Moves behind scenes
      - Uses coded signals
      strengths:
      - Coalition craft
      - Party intelligence
      - Negotiation leverage
      pitfalls:
      - Seen as cynical
      - Leak vulnerability
      - Distrusted by outsiders
    - name: The Moral Tribune
      description: Values-driven; treats politics as conscience with clear red lines
        and moral language.
      signature_tells:
      - Conscience framing
      - Principle rebellions
      - Ethical rhetoric
      strengths:
      - Integrity signal
      - Value coalition building
      - Clarity
      pitfalls:
      - Rigid negotiation
      - Polarising
      - Ignores second-order effects
    - name: The Cross-Party Fixer
      description: Quiet amendment-winner who accumulates reform via trust, reciprocity,
        and pragmatism.
      signature_tells:
      - Strange-bedfellow alliances
      - Avoids personal attacks
      - Treats wins as incremental
      strengths:
      - Durable reform
      - Trust-building
      - Low-drama effectiveness
      pitfalls:
      - Invisible to voters
      - Looks unprincipled to purists
      - Outflanked by loud factions
    - name: The Culture-Warrior
      description: Symbolic combatant; politics as identity conflict and boundary-setting.
      signature_tells:
      - High-salience wedges
      - Speech/symbol obsession
      - Threat framing
      strengths:
      - Mobilisation
      - Media attention
      - Sticky frames
      pitfalls:
      - Policy thinness
      - Escalation spiral
      - Coalition collapse
    - name: The Devolution Hawk
      description: Constitution-first worldview; union/devolution/sovereignty dominate
        interpretive frame.
      signature_tells:
      - Returns debates to settlement
      - Legitimacy language
      - Institution-as-identity framing
      strengths:
      - Strategic coherence
      - Institutional foresight
      - Identity politics instincts
      pitfalls:
      - Single-issue tunnel vision
      - Hard compromises
      - Centre-periphery flare-ups
    - name: The Party Ladder-Climber
      description: Promotion-minded; disciplined, risk-managed positions, visible
        loyalty, careful media behaviour.
      signature_tells:
      - No improvisation
      - Avoids landmines
      - ‘Responsibility’ language
      strengths:
      - Reliability
      - Message discipline
      - Ministerial suitability
      pitfalls:
      - Opportunism perception
      - Low authenticity
      - Avoids necessary conflict
