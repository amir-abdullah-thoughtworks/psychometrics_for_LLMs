# skeleton_singapore_seeds.yaml
SingaporeHealthPersonaSeeds:
  version: "1.0"

  # -------------------------------------------------------------------
  # Canonical health / lifestyle texts (titles only; enrich later if needed)
  # -------------------------------------------------------------------
CanonicalTexts:
  explanation: >
    Health, fitness, and preventive-care canon with strong Singapore and Asian
    public-health, urban lifestyle, and behavioural-change influence.
  titles:
    - "Healthier SG: A Preventive Care Strategy"
    - "Singapore’s War on Diabetes"
    - "Healthy Living Master Plan"
    - "The Singapore Way: Health Policy and Social Discipline"
    - "Urban Health in Singapore"
    - "Healthy Cities: Lessons from Singapore"
    - "Asian Diets and Metabolic Health"
    - "The Blue Zones Kitchen"
    - "The Blue Zones Solution"
    - "Outlive"
    - "Lifespan"
    - "Why We Sleep"
    - "Eat, Move, Sleep"
    - "Atomic Habits"
    - "The Power of Habit"
    - "Spark"
    - "Move Your DNA"
    - "The Longevity Diet"
    - "Deep Nutrition"
    - "How Not to Die"
    - "How Not to Diet"
    - "Being Mortal"
    - "The Art of Resilience"
    - "Ikigai"
    - "Ikigai: The Japanese Secret to a Long and Happy Life"
    - "The Happiness Advantage"
    - "Why Zebras Don’t Get Ulcers"
    - "The Psychology of Eating"
    - "Mindfulness for Beginners"
    - "Wherever You Go, There You Are"
    - "The Mindful Way Through Depression"
    - "Burnout: The Secret to Unlocking the Stress Cycle"
    - "Rest: Why You Get More Done When You Work Less"
    - "Sleep Smarter"
    - "The Circadian Code"
    - "Why We Sit Too Much"
    - "Deskbound"
    - "Exercised"
    - "Built to Move"
    - "Younger Next Year"
    - "The Joy of Movement"
    - "The Obesity Code"
    - "The Diabetes Code"
    - "Metabolical"
    - "The Plant-Based Diet for Beginners"
    - "Asian Green Tea and Longevity"
    - "Traditional Chinese Medicine and Modern Health"
    - "Ayurveda and Preventive Health"
    - "Healthy Hawker Eating"
    - "Eating Well in Singapore"
    - "Nutrition for Asians"
    - "Asian Body, Western Diet"
    - "Healthy Ageing in Asia"
    - "Successful Ageing"
    - "Healthy Ageing in Singapore"
    - "Exercise Is Medicine"
    - "Strength Training After 40"
    - "Mobility for Life"
    - "The Pain-Free Body"
    - "Explain Pain"
    - "Why We Hurt"
    - "The Body Keeps the Score"
    - "Mind-Body Medicine"
    - "Stress-Proof"
