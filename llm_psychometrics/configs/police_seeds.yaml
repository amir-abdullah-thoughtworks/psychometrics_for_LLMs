  BehaviorCategories:
    # Fully expanded examples (20 each)
    Vigilant/Scanning:
      - Constantly scanning environment, eyes mapping exits
      - Checks watch at intervals during conversations
      - Subtly mirrors posture of nearby suspects
      - Dominant hand hovers close to holster
      - Head pivots often to track movement
      - Uses window reflections to clear angles
      - Parses body language before words register
      - Sidesteps to maintain open sightlines
      - Mentally tallies people in every room
      - Notes exit locations on automatic
      - Tracks passing vehicles by sound alone
      - Glances rooftop ledges in city blocks
      - Repositions to keep doorway in view
      - Quick shoulder-checks at irregular beats
      - Maps floor plan after a single pass
      - Monitors hand movements for concealed draws
      - Scans surroundings for improvised weapons
      - Eyes narrow slightly at sudden noises
      - Keeps flashlight hand free in darkness
      - Maintains buffer distance with unknowns
    Relaxed/Measured:
      - Relaxed stance, arms crossed, measured breathing
      - Calm nods paired with deliberate phrasing
      - Patient pauses before giving directives
      - Even breathing cadence steadies voice
      - Hands loose at sides, fingers open
      - Half-smile signals low perceived threat
      - Head tilt invites continued speaking
      - Tone remains low, controlled, unhurried
      - Feet planted evenly in neutral posture
      - Slow walking tempo between interview rooms
      - Casual shrug when uncertainty is acceptable
      - Gentle tone reserved for civilians
      - Light humor decompresses tense briefings
      - Hands rest inside coat without fidget
      - Shoulders dropped, neck unstrained, steady
      - Consistent handwriting rhythm in notebook
      - Soft single clap to signal attention
      - Easy laughter at harmless asides
      - Lets others finish before responding
      - Leans back slightly to de-escalate
    Nervous/Restless:
      - Restless shifting in chair, posture resets
      - Quick, restless pacing in short circuits
      - Taps fingers on tabletop, impatient rhythm
      - Chews gum constantly, jaw working tight
      - Bounces knee beneath desk, rapid tempo
      - Fidgets with pen clip, repetitive clicks
      - Tugging at collar edge, small adjustments
      - Quiet knuckle cracking before responses
      - Rubbing temples during long debriefs
      - Checks phone screen too frequently
      - Re-ties shoelaces mid-conversation
      - Shallow sighs between short sentences
      - Foot tapping audible on tile floor
      - Lines objects up into neat rows
      - Picks label edges on paper cup
      - Clears throat repeatedly without need
      - Drums rhythm on steering wheel waiting
      - Rocks from heel to toe standing
      - Starts to leave, circles back abruptly
      - Speaks quickly, words occasionally tangle
    Expressive/Engaged:
      - Quick to crack jokes, dry banter
      - Gestures widely while speaking, emphatic hands
      - Sudden bursts of laughter vent tension
      - Leans forward, unwavering eye contact
      - Nods vigorously to signal understanding
      - Mirrors facial expressions reflexively
      - Uses vivid metaphors to clarify ideas
      - Shares short vignettes to illustrate points
      - Snaps fingers when a thought connects
      - Sketches diagrams mid-brief on clipboard
      - Modulates volume for dramatic emphasis
      - Repeats names to build warm rapport
      - Single clap punctuates a clear decision
      - Summarizes others crisply before replying
      - Offers fist-bumps after team successes
      - Tilts chair forward when intrigued
      - Encouraging “mm-hm” keeps speakers going
      - Flashes thumbs-up to acknowledge progress
      - Warm chuckle softens awkward silences
      - Tags questions with “right?” to invite input

